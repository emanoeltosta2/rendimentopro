<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Emerald to Rich Dark Green -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Glowing Area Fill under curve -->
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Neon Mint Trend Line Gradient -->
    <linearGradient id="trendGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Gold Accent for Profit & Compounding Badge -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Subtle Inner Glow Border -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle Background with Rich Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Ambient Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="6 6">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="160" y1="110" x2="160" y2="390"/>
    <line x1="256" y1="110" x2="256" y2="390"/>
    <line x1="352" y1="110" x2="352" y2="390"/>
  </g>

  <!-- Area Fill Under Exponential Curve -->
  <path d="M 96 360 C 180 355, 230 330, 280 270 C 330 210, 370 160, 420 135 L 420 376 L 96 376 Z" fill="url(#areaGrad)"/>

  <!-- Ascending Compounding Trend Curve with Glow -->
  <path d="M 96 360 C 180 355, 230 330, 280 270 C 330 210, 370 160, 420 135" fill="none" stroke="url(#trendGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glowShadow)"/>

  <!-- Dynamic Arrow Peak -->
  <path d="M 370 135 L 420 135 L 420 185" fill="none" stroke="#6ee7b7" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowShadow)"/>

  <!-- Milestone Nodes along the path -->
  <circle cx="96" cy="360" r="12" fill="#047857" stroke="#6ee7b7" stroke-width="4"/>
  <circle cx="210" cy="336" r="10" fill="#10b981" stroke="#ecfdf5" stroke-width="4"/>
  <circle cx="280" cy="270" r="13" fill="#34d399" stroke="#ffffff" stroke-width="5" filter="url(#softShadow)"/>
  <circle cx="350" cy="195" r="14" fill="#6ee7b7" stroke="#ffffff" stroke-width="5" filter="url(#softShadow)"/>

  <!-- Top-Left Floating Badge: R$ Real Currency Symbol -->
  <g transform="translate(86, 92)" filter="url(#softShadow)">
    <rect width="90" height="48" rx="24" fill="#064e3b" stroke="#34d399" stroke-width="2.5" fill-opacity="0.85"/>
    <circle cx="24" cy="24" r="14" fill="url(#goldGrad)"/>
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">R$</text>
    <text x="58" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#6ee7b7" text-anchor="middle">PRO</text>
  </g>

  <!-- Sparkle Accent in Upper Right -->
  <g transform="translate(400, 90)" fill="#fbbf24" opacity="0.9">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" />
  </g>
</svg>

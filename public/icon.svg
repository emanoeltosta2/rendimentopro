<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container with rounded corners (safe for maskable and any) -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines in safe zone -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <line x1="96" y1="180" x2="416" y2="180"/>
    <line x1="96" y1="260" x2="416" y2="260"/>
    <line x1="96" y1="340" x2="416" y2="340"/>
  </g>

  <!-- Growth Area Fill in Safe Area (centered between 96 and 416) -->
  <path d="M 110 350 L 190 310 L 270 330 L 330 220 L 402 160 L 402 360 L 110 360 Z" fill="url(#chartGrad)"/>

  <!-- Glowing Trend Line -->
  <path d="M 110 350 L 190 310 L 270 330 L 330 220 L 402 160" fill="none" stroke="url(#lineGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Arrow Indicator -->
  <path d="M 360 160 L 402 160 L 402 202" fill="none" stroke="#6ee7b7" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Milestone Nodes -->
  <circle cx="110" cy="350" r="10" fill="#10b981" stroke="#ecfdf5" stroke-width="4"/>
  <circle cx="190" cy="310" r="10" fill="#10b981" stroke="#ecfdf5" stroke-width="4"/>
  <circle cx="270" cy="330" r="10" fill="#10b981" stroke="#ecfdf5" stroke-width="4"/>
  <circle cx="330" cy="220" r="12" fill="#34d399" stroke="#ffffff" stroke-width="5"/>
  <circle cx="402" cy="160" r="14" fill="#6ee7b7" stroke="#ffffff" stroke-width="5"/>

  <!-- Currency / Yield Symbol Badge in Top Left Safe Zone -->
  <g transform="translate(110, 120)">
    <circle cx="28" cy="28" r="28" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="3"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">R$</text>
  </g>
</svg>
